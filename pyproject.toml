[project]
# Derive the version from Git tags and commits.
dynamic = ["version"]
name = "toolkit_extension"
authors = [
  {name="Joshua Talib", email="joshuatalib@ecmwf.int" },
  {name="Innocent Masukwedza", email="g.t.masukwedza@reading.ac.uk"},
  {name="Piotr Wolski",email="wolski@csag.uct.ac.za"}
]
description = "A python package to support download and analysis of forecasts from S2S prediction project database."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.23",
    "cdo>=1.6.0",
    "xarray>=2024.9.0",
    "eccodes>=2.40.0",
    "dask>=2024.9.0",
    "pandas>=2.2.3",
    "scipy>=1.14.1",
    "netCDF4>=1.7.2",
    "requests>=2.32.2",
    "matplotlib>=3.8",
    "cartopy>=0.22",
    "huracanpy>=1.3.1",
    "geopandas>=1.0.0",
    "cdsapi>=0.7.7",
    "xsdba>=0.7.0",
    "xskillscore==0.0.29",
    "xarray-regrid<0.5.0",
]

[project.urls]
Homepage = "https://github.com/piotr-whynot/toolkit_extension"

# build system
[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-data = { "toolkit_extension.lookup_tables" = ["*.csv"] }

[tool.setuptools_scm]
# Generate the version file during installation or building.
version_file = "src/toolkit_extension/_version.py"
